<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Privado</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0d0d0d; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1a1a1a; padding: 2rem; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 8px 25px rgba(0,0,0,0.7); }
    .video-card { max-width: 900px; display: none; }
    h2 { margin-top: 0; text-align: center; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #333; box-sizing: border-box; font-size: 16px; }
    input { background: #262626; color: #fff; }
    input:focus { outline: none; border-color: #0070f3; }
    button { background: #0070f3; color: #fff; font-weight: bold; border: none; cursor: pointer; margin-top: 12px; }
    button:hover { background: #005bb5; }
    .error { color: #ff4d4d; font-size: 14px; margin-top: 10px; text-align: center; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; }
    .timer { color: #00e676; font-weight: bold; font-size: 16px; }
    .player-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; }
    video, iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <div class="card" id="login-box">
    <h2>Acceso al Vídeo</h2>
    <input type="text" id="user" placeholder="Usuario" autocomplete="off">
    <input type="password" id="pass" placeholder="Contraseña">
    <button onclick="iniciarSesion()">Entrar</button>
    <div class="error" id="login-error"></div>
  </div>

  <div class="card video-card" id="video-box">
    <div class="top-bar">
      <span>Sesión activa (1 dispositivo)</span>
      <span class="timer" id="countdown">--:--</span>
    </div>
    <div class="player-wrapper" id="player-container"></div>
  </div>

  <script>
    let timerInterval = null;
    let pingInterval = null;

    async function iniciarSesion() {
      const username = document.getElementById('user').value.trim();
      const password = document.getElementById('pass').value.trim();
      const errorDiv = document.getElementById('login-error');

      if (!username || !password) {
        errorDiv.textContent = 'Introduce usuario y contraseña.';
        return;
      }

      errorDiv.textContent = 'Verificando...';

      try {
        const res = await fetch('/.netlify/functions/api', {
          method: 'POST',
          body: JSON.stringify({ action: 'login', username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          errorDiv.textContent = data.error || 'Error de acceso.';
          return;
        }

        document.getElementById('login-box').style.display = 'none';
        document.getElementById('video-box').style.display = 'block';
        cargarReproductor(data.videoUrl);
        iniciarCuentaAtras(data.expiresAt);

        pingInterval = setInterval(async () => {
          const pingRes = await fetch('/.netlify/functions/api', {
            method: 'POST',
            body: JSON.stringify({ action: 'heartbeat', username, token: data.token })
          });
          const pingData = await pingRes.json();
          if (!pingData.valid) {
            expulsar(pingData.reason);
          }
        }, 8000);

      } catch (err) {
        errorDiv.textContent = 'Error de conexión con el servidor.';
      }
    }

    function cargarReproductor(url) {
      const container = document.getElementById('player-container');
      if (url.includes('youtube.com') || url.includes('youtu.be') || url.includes('drive.google.com') || url.includes('vimeo.com')) {
        let embedUrl = url;
        if (url.includes('watch?v=')) embedUrl = url.replace('watch?v=', 'embed/');
        if (url.includes('youtu.be/')) embedUrl = url.replace('youtu.be/', 'www.youtube.com/embed/');
        if (url.includes('drive.google.com') && url.includes('/view')) embedUrl = url.replace('/view', '/preview');
        container.innerHTML = `<iframe src="${embedUrl}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
      } else {
        container.innerHTML = `<video src="${url}" controls autoplay controlsList="nodownload" oncontextmenu="return false;"></video>`;
      }
    }

    function iniciarCuentaAtras(expiresAt) {
      timerInterval = setInterval(() => {
        const diff = expiresAt - Date.now();
        if (diff <= 0) {
          expulsar('Tu tiempo de visualización ha terminado.');
          return;
        }
        const mins = Math.floor(diff / 60000);
        const secs = Math.floor((diff % 60000) / 1000);
        document.getElementById('countdown').textContent = 
          `Tiempo restante: ${mins}:${secs < 10 ? '0' : ''}${secs}`;
      }, 1000);
    }

    function expulsar(motivo) {
      clearInterval(timerInterval);
      clearInterval(pingInterval);
      document.getElementById('player-container').innerHTML = '';
      alert(motivo);
      location.reload();
    }
  </script>
</body>
</html>
